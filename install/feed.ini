[feed]
; root folder of the virtual scanner. Images are read from <root>\in, served images are moved to <root>\done,
; unreadable files go to <root>\bad, and a log is written to <root>\feed.log
root=C:\VirtualScan
; 1 = always deliver the whole image (recommended: images are already page-sized like real scans)
full_page=1
; 0 = use the dpi stored in each image file. Set to e.g. 200 to treat all images as 200 dpi.
image_dpi=0
